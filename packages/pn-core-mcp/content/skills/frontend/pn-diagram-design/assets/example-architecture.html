<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout architecture</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Code+Pro:wght@500;600&family=Source+Sans+3:wght@500;600;700&display=swap"
    />
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #1c1917;
        --muted: #57534e;
        --accent: #b45309;
        --accent-tint: #fde8d2;
        --link: #1d4ed8;
        --rule: rgba(28, 25, 23, 0.12);
        --font-title: "Fraunces", "Iowan Old Style", serif;
        --font-sans: "Source Sans 3", "Source Sans Pro", sans-serif;
        --font-mono: "Source Code Pro", "IBM Plex Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      main {
        max-width: 832px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 8px;
      }
      h1 {
        font-family: var(--font-title);
        font-weight: 500;
        font-size: 32px;
        line-height: 1.2;
        margin: 0 0 8px;
      }
      .lede {
        color: var(--muted);
        font-size: 16px;
        margin: 0 0 24px;
        max-width: 40rem;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Architecture</p>
      <h1>Checkout request path</h1>
      <p class="lede">
        One accent: the orders API. Everything else is supporting structure. Tokens
        are CSS variables — replace from <code>.pncore-design.md</code>.
      </p>
      <svg
        role="img"
        aria-labelledby="checkout-arch-title checkout-arch-desc"
        viewBox="0 0 800 400"
        xmlns="http://www.w3.org/2000/svg"
      >
        <title id="checkout-arch-title">Checkout architecture</title>
        <desc id="checkout-arch-desc">
          Web client calls an API gateway, which routes to the orders service.
          Orders reads Redis and writes Postgres.
        </desc>
        <rect width="800" height="400" fill="var(--paper)" />
        <defs>
          <marker
            id="arrow"
            markerWidth="8"
            markerHeight="6"
            refX="7"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 8 3, 0 6" fill="var(--muted)" />
          </marker>
          <marker
            id="arrow-accent"
            markerWidth="8"
            markerHeight="6"
            refX="7"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 8 3, 0 6" fill="var(--accent)" />
          </marker>
        </defs>
        <!-- connectors first -->
        <path
          d="M176 112 H256"
          fill="none"
          stroke="var(--accent)"
          stroke-width="1.2"
          marker-end="url(#arrow-accent)"
        />
        <rect x="192" y="88" width="48" height="16" rx="2" fill="var(--paper)" />
        <text
          x="216"
          y="100"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
          letter-spacing="0.06em"
        >
          HTTPS
        </text>
        <path
          d="M384 112 H464"
          fill="none"
          stroke="var(--accent)"
          stroke-width="1.2"
          marker-end="url(#arrow-accent)"
        />
        <rect x="400" y="88" width="48" height="16" rx="2" fill="var(--paper)" />
        <text
          x="424"
          y="100"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
          letter-spacing="0.06em"
        >
          ROUTE
        </text>
        <path
          d="M528 160 V256"
          fill="none"
          stroke="var(--muted)"
          stroke-width="1"
          marker-end="url(#arrow)"
        />
        <rect x="536" y="196" width="40" height="16" rx="2" fill="var(--paper)" />
        <text
          x="556"
          y="208"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
        >
          CACHE
        </text>
        <path
          d="M592 112 H688 Q696 112 696 120 V256"
          fill="none"
          stroke="var(--muted)"
          stroke-width="1"
          marker-end="url(#arrow)"
        />
        <rect x="700" y="168" width="32" height="16" rx="2" fill="var(--paper)" />
        <text
          x="716"
          y="180"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
        >
          SQL
        </text>
        <!-- nodes -->
        <rect x="48" y="80" width="128" height="64" rx="8" fill="var(--paper)" />
        <rect
          x="48"
          y="80"
          width="128"
          height="64"
          rx="8"
          fill="rgba(28,25,23,0.03)"
          stroke="var(--ink)"
          stroke-opacity="0.3"
          stroke-width="1"
        />
        <text
          x="112"
          y="108"
          text-anchor="middle"
          fill="var(--ink)"
          font-size="12"
          font-weight="700"
          font-family="var(--font-sans)"
        >
          Web client
        </text>
        <text
          x="112"
          y="124"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
        >
          SPA
        </text>
        <rect x="256" y="80" width="128" height="64" rx="8" fill="var(--paper)" />
        <rect
          x="256"
          y="80"
          width="128"
          height="64"
          rx="8"
          fill="#fff"
          stroke="var(--ink)"
          stroke-width="1"
        />
        <text
          x="320"
          y="108"
          text-anchor="middle"
          fill="var(--ink)"
          font-size="12"
          font-weight="700"
          font-family="var(--font-sans)"
        >
          Gateway
        </text>
        <text
          x="320"
          y="124"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
        >
          edge:443
        </text>
        <rect x="464" y="80" width="128" height="64" rx="8" fill="var(--paper)" />
        <rect
          x="464"
          y="80"
          width="128"
          height="64"
          rx="8"
          fill="var(--accent-tint)"
          stroke="var(--accent)"
          stroke-width="1.2"
        />
        <text
          x="528"
          y="108"
          text-anchor="middle"
          fill="var(--ink)"
          font-size="12"
          font-weight="700"
          font-family="var(--font-sans)"
        >
          Orders API
        </text>
        <text
          x="528"
          y="124"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
        >
          checkout
        </text>
        <rect x="464" y="256" width="128" height="64" rx="8" fill="var(--paper)" />
        <rect
          x="464"
          y="256"
          width="128"
          height="64"
          rx="8"
          fill="rgba(28,25,23,0.05)"
          stroke="var(--muted)"
          stroke-width="1"
        />
        <text
          x="528"
          y="284"
          text-anchor="middle"
          fill="var(--ink)"
          font-size="12"
          font-weight="700"
          font-family="var(--font-sans)"
        >
          Redis
        </text>
        <text
          x="528"
          y="300"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
        >
          session
        </text>
        <rect x="632" y="256" width="128" height="64" rx="8" fill="var(--paper)" />
        <rect
          x="632"
          y="256"
          width="128"
          height="64"
          rx="8"
          fill="rgba(28,25,23,0.05)"
          stroke="var(--muted)"
          stroke-width="1"
        />
        <text
          x="696"
          y="284"
          text-anchor="middle"
          fill="var(--ink)"
          font-size="12"
          font-weight="700"
          font-family="var(--font-sans)"
        >
          Postgres
        </text>
        <text
          x="696"
          y="300"
          text-anchor="middle"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
        >
          orders
        </text>
        <line
          x1="48"
          y1="352"
          x2="752"
          y2="352"
          stroke="var(--rule)"
          stroke-width="0.8"
        />
        <text
          x="48"
          y="372"
          fill="var(--muted)"
          font-size="8"
          font-family="var(--font-mono)"
          letter-spacing="0.14em"
        >
          LEGEND
        </text>
        <rect
          x="128"
          y="360"
          width="12"
          height="12"
          rx="2"
          fill="var(--accent-tint)"
          stroke="var(--accent)"
        />
        <text
          x="148"
          y="370"
          fill="var(--muted)"
          font-size="12"
          font-family="var(--font-sans)"
        >
          Focal path
        </text>
        <rect
          x="256"
          y="360"
          width="12"
          height="12"
          rx="2"
          fill="rgba(28,25,23,0.05)"
          stroke="var(--muted)"
        />
        <text
          x="276"
          y="370"
          fill="var(--muted)"
          font-size="12"
          font-family="var(--font-sans)"
        >
          Store
        </text>
      </svg>
    </main>
  </body>
</html>
