# External URL link check (lychee). Non-blocking; scheduled + manual only.
# Offline pn-core:// and relative links are covered by scripts/check-doc-links.mjs in validate.
name: Link check (external)

on:
  schedule:
    # Weekly Monday 06:15 UTC
    - cron: "15 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Focus on markdown under content + docs; skip node_modules and generated noise.
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --exclude 'file://.*'
            'packages/pn-core-mcp/content/**/*.md'
            'packages/pn-core-mcp/content/**/*.mdc'
            'docs/**/*.md'
          fail: false
