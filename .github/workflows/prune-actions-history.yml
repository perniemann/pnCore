# Prune old GitHub Actions runs (keeps latest run per workflow).
# Trigger manually when the Actions UI history gets noisy.
name: Prune Actions history

on:
  schedule:
    # Weekly cleanup — keeps latest run per workflow, drops log/storage churn.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      logs_only:
        description: "Delete log archives only (keep run entries in UI)"
        type: boolean
        default: false
      dry_run:
        description: "List runs that would be pruned without deleting"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Prune workflow runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.logs_only }}" = "true" ]; then args+=(--logs-only); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          node scripts/github-actions-prune-runs.mjs "${args[@]}"
