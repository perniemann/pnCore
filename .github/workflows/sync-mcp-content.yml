# Ensure plugin (plugins/pnCore) is in sync with canonical MCP content (packages/pn-core-mcp/content/).
# Canonical source: packages/pn-core-mcp/content/. Run npm run sync:content to update plugin.
#
# Runs on every PR, every push to main, and after each auto-merge (pr-automerge.yml dispatches
# it, because merges by GITHUB_TOKEN do not trigger push workflows).
name: Sync MCP content

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every PR runs full CI so Dependabot auto-merge can gate on test:full (see dependabot-automerge.yml).
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Full check (sync, build, test, lint, validate)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PR_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: npm run test:full

      - name: Fail if plugin is out of sync
        run: |
          git diff --exit-code plugins/pnCore || (
            echo "::error::plugins/pnCore/ is out of sync with packages/pn-core-mcp/content/. Run: npm run sync:content && commit the changes."
            exit 1
          )

      # Consumers run the committed dist/ (npx git+…#main skips the build when dist exists).
      - name: Fail if committed dist differs from a fresh build
        run: |
          git diff --exit-code packages/pn-core-mcp/dist || (
            echo "::error::packages/pn-core-mcp/dist/ differs from npm run build:mcp. Rebuild and commit dist/."
            exit 1
          )
