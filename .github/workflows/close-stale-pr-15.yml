# One-shot: close obsolete PR #15 (PM router, superseded by merged #16).
# Safe to delete this file after the workflow succeeds once.
name: Close stale PR 15

on:
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close superseded PR #15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state=$(gh pr view 15 --json state -q .state 2>/dev/null || echo "missing")
          if [ "$state" = "OPEN" ]; then
            gh pr close 15 --comment "Superseded by #16 (merged to main). PM-router approach abandoned; ADR-0008 pn submenu shipped."
            echo "Closed PR #15."
          else
            echo "PR #15 already ${state}; nothing to do."
          fi
