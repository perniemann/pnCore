# Rejects commits that include Cursor-injected message trailers (Made-with / Co-authored-by).
name: Commit message policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-ide-trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Short-circuit so pull_request.* is not evaluated on push (undefined there).
      - name: Block IDE commit trailers
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PR_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: node scripts/check-commit-no-ide-trailers.mjs
