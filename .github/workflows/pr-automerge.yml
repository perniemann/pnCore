# Squash-merge PRs labeled automerge after CI + pn-gates + pn-review pass.
# Opt-in only; skips semver-major version bumps (manual review).
name: PR auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  # gh pr checks / commit check-runs need these; without them the wait loop
  # sees an empty list forever and times out ("No checks registered yet").
  checks: read
  statuses: read
  actions: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip semver-major version bumps
        id: major
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          base_ver=$(git show "${base}:package.json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          head_ver=$(git show "${head}:package.json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          base_major=${base_ver%%.*}
          head_major=${head_ver%%.*}
          if [ "$base_major" != "$head_major" ]; then
            echo "Semver-major bump (${base_ver} → ${head_ver}) — manual review required."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI (excluding this workflow)
        if: steps.major.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required_checks=("no-ide-trailers" "sync (22)" "sync (24)" "pn-gates" "pn-review")

          # Prefer gh pr checks; fall back to commit check-runs when the PR
          # rollup is empty (seen on labeled-only triggers).
          list_checks() {
            local out
            if out=$(gh pr checks "$PR" --json name,bucket,workflow \
              -q '.[] | [.name,.bucket,.workflow] | @tsv' 2>/dev/null) \
              && [[ -n "$out" ]]; then
              printf '%s\n' "$out"
              return 0
            fi
            gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              -q '.check_runs[] | [.name,
                (if .status != "completed" then "pending"
                 elif .conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped" then "pass"
                 elif .conclusion == "cancelled" then "cancel"
                 else "fail" end),
                (.app.name // "")] | @tsv' 2>/dev/null || true
          }

          for attempt in $(seq 1 40); do
            if ! mapfile -t rows < <(list_checks); then
              echo "listing checks failed; retrying... (${attempt}/40)"
              sleep 30
              continue
            fi
            if [[ ${#rows[@]} -eq 0 ]]; then
              echo "No checks registered yet... (${attempt}/40)"
              sleep 30
              continue
            fi
            pending=0
            failed=""
            declare -A bucket_by_name=()
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r name bucket workflow <<< "$row"
              if [[ "$workflow" == *"PR auto-merge"* ]] || [[ "$name" == "automerge" ]]; then
                continue
              fi
              bucket_by_name["$name"]="$bucket"
              case "$bucket" in
                pending) pending=$((pending + 1)) ;;
                fail|cancel) failed="${failed} ${name}" ;;
              esac
            done
            if [[ -n "${failed// }" ]]; then
              echo "::error::CI failed:${failed}"
              exit 1
            fi
            if [[ "$pending" -eq 0 ]]; then
              for check in "${required_checks[@]}"; do
                bucket="${bucket_by_name[$check]:-missing}"
                if [[ "$bucket" != "pass" ]]; then
                  echo "Required check not passing yet: ${check} (${bucket})"
                  pending=1
                  break
                fi
              done
            fi
            if [[ "$pending" -eq 0 ]]; then
              echo "All required CI checks passed."
              exit 0
            fi
            echo "Waiting for ${pending} check(s)... (${attempt}/40)"
            sleep 30
          done
          echo "::error::Timed out waiting for CI"
          exit 1

      - name: Squash merge
        if: steps.major.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title=$(gh pr view "$PR" --json title -q .title)
          gh pr merge "$PR" --squash --delete-branch --subject "$title" --body ""
