# Squash-merge PRs labeled automerge after CI + pn-gates + pn-review pass.
# Opt-in only; skips semver-major version bumps (manual review).
name: PR auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Skip semver-major version bumps
        id: major
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          base_ver=$(git show "${base}:package.json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          head_ver=$(git show "${head}:package.json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          base_major=${base_ver%%.*}
          head_major=${head_ver%%.*}
          if [ "$base_major" != "$head_major" ]; then
            echo "Semver-major bump (${base_ver} → ${head_ver}) — manual review required."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI (excluding this workflow)
        if: steps.major.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          required_checks=("no-ide-trailers" "sync (22)" "sync (24)" "pn-gates" "pn-review")
          for attempt in $(seq 1 40); do
            if ! mapfile -t rows < <(
              gh pr checks "$PR" --json name,bucket,workflow -q '.[] | [.name,.bucket,.workflow] | @tsv' 2>/dev/null
            ); then
              echo "gh pr checks failed; retrying... (${attempt}/40)"
              sleep 30
              continue
            fi
            if [[ ${#rows[@]} -eq 0 ]]; then
              echo "No checks registered yet... (${attempt}/40)"
              sleep 30
              continue
            fi
            pending=0
            failed=""
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r name bucket workflow <<< "$row"
              if [[ "$workflow" == *"PR auto-merge"* ]]; then
                continue
              fi
              case "$bucket" in
                pending) pending=$((pending + 1)) ;;
                fail|cancel) failed="${failed} ${name}" ;;
              esac
            done
            if [[ -n "${failed// }" ]]; then
              echo "::error::CI failed:${failed}"
              exit 1
            fi
            if [[ "$pending" -eq 0 ]]; then
              for check in "${required_checks[@]}"; do
                bucket=$(gh pr checks "$PR" --name "$check" --json bucket -q '.[0].bucket' 2>/dev/null || echo "missing")
                if [[ "$bucket" != "pass" ]]; then
                  echo "Required check not passing yet: ${check} (${bucket})"
                  pending=1
                  break
                fi
              done
            fi
            if [[ "$pending" -eq 0 ]]; then
              echo "All required CI checks passed."
              exit 0
            fi
            echo "Waiting for ${pending} check(s)... (${attempt}/40)"
            sleep 30
          done
          echo "::error::Timed out waiting for CI"
          exit 1

      - name: Squash merge
        if: steps.major.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title=$(gh pr view "$PR" --json title -q .title)
          gh pr merge "$PR" --squash --delete-branch --subject "$title" --body ""
