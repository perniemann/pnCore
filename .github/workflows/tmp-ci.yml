# One-shot: format, rebuild dist with real tsc, commit back, then run test:full.
# Removed before the PR merges.
name: tmp format build

on:
  push:
    branches: [test/in-process-tool-coverage]

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format
      - run: npm run sync:content
      - run: npm run build:mcp
      - name: Commit formatting and dist
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then echo "no changes"; else
            git diff --cached --stat
            git commit -m "chore: format and rebuild dist"
            git push origin HEAD:test/in-process-tool-coverage
          fi
      - name: test:full
        run: npm run test:full
      - name: delete the throwaway node_modules branch
        if: always()
        run: git push origin --delete tmp/node-modules || true
