# Squash-merge Dependabot patch/minor/group PRs after CI passes.
# Private repos without branch protection: we poll checks and merge directly
# (not gh pr merge --auto, which would merge immediately with no required checks).
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip major semver bumps
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update — manual review required."

      - name: Wait for CI (excluding this workflow)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required_checks=("no-ide-trailers" "sync (22)" "sync (24)" "pn-gates" "pn-review")

          list_checks() {
            local out
            if out=$(gh pr checks "$PR" --json name,bucket,workflow \
              -q '.[] | [.name,.bucket,.workflow] | @tsv' 2>/dev/null) \
              && [[ -n "$out" ]]; then
              printf '%s\n' "$out"
              return 0
            fi
            gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              -q '.check_runs[] | [.name,
                (if .status != "completed" then "pending"
                 elif .conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped" then "pass"
                 elif .conclusion == "cancelled" then "cancel"
                 else "fail" end),
                (.app.name // "")] | @tsv' 2>/dev/null || true
          }

          for attempt in $(seq 1 40); do
            if ! mapfile -t rows < <(list_checks); then
              echo "listing checks failed; retrying... (${attempt}/40)"
              sleep 30
              continue
            fi
            if [[ ${#rows[@]} -eq 0 ]]; then
              echo "No checks registered yet... (${attempt}/40)"
              sleep 30
              continue
            fi
            pending=0
            failed=""
            declare -A bucket_by_name=()
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r name bucket workflow <<< "$row"
              if [[ "$workflow" == *"Dependabot auto-merge"* ]] || [[ "$name" == "automerge" ]]; then
                continue
              fi
              bucket_by_name["$name"]="$bucket"
              case "$bucket" in
                pending) pending=$((pending + 1)) ;;
                fail|cancel) failed="${failed} ${name}" ;;
              esac
            done
            if [[ -n "${failed// }" ]]; then
              echo "::error::CI failed:${failed}"
              exit 1
            fi
            if [[ "$pending" -eq 0 ]]; then
              for check in "${required_checks[@]}"; do
                bucket="${bucket_by_name[$check]:-missing}"
                if [[ "$bucket" != "pass" ]]; then
                  echo "Required check not passing yet: ${check} (${bucket})"
                  pending=1
                  break
                fi
              done
            fi
            if [[ "$pending" -eq 0 ]]; then
              echo "All required CI checks passed."
              exit 0
            fi
            echo "Waiting for ${pending} check(s)... (${attempt}/40)"
            sleep 30
          done
          echo "::error::Timed out waiting for CI"
          exit 1

      - name: Squash merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
