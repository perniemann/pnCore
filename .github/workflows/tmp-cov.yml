# One-shot: ship node_modules to a throwaway branch so an offline agent session can run vitest.
# Removed before the PR merges; the branch tmp/node-modules is deleted after use.
name: tmp node_modules
on:
  push:
    branches: [test/in-process-tool-coverage]
permissions:
  contents: write
jobs:
  nm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: pack and push
        run: |
          set -eu
          tar -czf /tmp/nm.tgz node_modules packages/pn-core-mcp/node_modules
          ls -la /tmp/nm.tgz
          mkdir /tmp/out && cd /tmp/out && split -b 90m /tmp/nm.tgz nm.tgz.part-
          git init -q && git checkout -q -b tmp/node-modules
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "chore: throwaway node_modules snapshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:tmp/node-modules
