# Patch/minor/group PRs merge automatically when CI passes (.github/workflows/dependabot-automerge.yml).
# Major semver bumps stay open for manual review.
version: 2
updates:
  # Root npm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # MCP package
  - package-ecosystem: "npm"
    directory: "/packages/pn-core-mcp"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
